<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: #FF69B4; /* Hot Pink */
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
           EOF text-align: center;
            color: white;
            font-size: 3em;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }
        .shop-item {
            text-align: center;
            width: 350px;
        }
        img {
        EOF    width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid white;
            margin-bottom: 15px;
        }
        a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 5px;
        }
        a:hover {
            background: white;
            color: #FF69B4;
        }
        hr {
            border: 0;
            height: 2px;
            background: white;
            margin: 50px 0 20px 0;
        }
        .footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Special Shop & Tech! ⚡</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Smartphones">
            <br><br>
            <a href="https://www.apple.com" target="_blank">Buy Phones</a>
        </div>

        <div class="shop-item">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500" alt="Computers">
            <br><br>
            <a href="https://www.dell.com" target="_blank">Buy Computers</a>
        </div>
    </div>

    <hr>
</body>
</html>
