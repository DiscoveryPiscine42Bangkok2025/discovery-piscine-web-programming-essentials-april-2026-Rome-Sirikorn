<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Box Layout</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .box { width: 200px; height: 150px; background: white; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Yes</div>
        <div class="box">No</div>
    </div>
</body>
</html>
