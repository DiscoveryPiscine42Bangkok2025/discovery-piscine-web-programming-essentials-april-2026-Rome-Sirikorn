<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        input[type="submit"] {
            cursor: pointer;
        }
    </style>
</head>
<body>

<form id="calcForm">
    <input type="text" id="left" placeholder="Left number">
    
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>
    
    <input type="text" id="right" placeholder="Right number">
    
    <input type="submit" value="Try me!">
</form>

<script>
    const form = document.getElementById("calcForm");

    function isValidPositiveInteger(value) {
        return /^[0-9]+$/.test(value);
    }

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const left = document.getElementById("left").value;
        const right = document.getElementById("right").value;
        const operator = document.getElementById("operator").value;

        // Validation
        if (!isValidPositiveInteger(left) || !isValidPositiveInteger(right)) {
            alert("Error :(");
            return;
        }

        const a = parseInt(left);
        const b = parseInt(right);
        let result;

        // Division or modulo by zero
        if ((operator === "/" || operator === "%") && b === 0) {
            alert("It’s over 9000!");
            console.log("It’s over 9000!");
            return;
        }

        // Calculation
        switch (operator) {
            case "+":
                result = a + b;
                break;
            case "-":
                result = a - b;
                break;
            case "*":
                result = a * b;
                break;
            case "/":
                result = a / b;
                break;
            case "%":
                result = a % b;
                break;
        }

        alert(result);
        console.log(result);
    });

    // Every 30 seconds alert
    setInterval(() => {
        alert("Please, use me...");
    }, 30000);
</script>

</body>
</html>
